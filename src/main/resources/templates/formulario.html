<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: head('Formulário')}"></head>

<body>

    <header th:replace="~{fragmentos/header :: header('formulario')}"></header>

    <div class="divBackground">

        <div class="IForm container">

            <form th:action="@{/formulario/salvar}"
                  th:object="${form}"
                  method="post"
                  class="formulario">

                <div class="carousel">

                    <div class="carousel-track" id="carouselTrack">

                        <!-- =========================
                             ETAPA 1
                        ========================== -->

                        <section class="etapa">

                            <h2>Dados do estagiário</h2>

                            <label class="IForm label">Insira o nome do estagiário:</label>
                            <input type="text" th:field="*{NomeEstagiario}" class="IForm input text">
							
							<label class="IForm label">Insira o cpf do estagiário:</label>
							<input type="text" th:field="*{CpfEstagiario}" class="IForm input text">

                            <label class="IForm label">Insira o telefone do estagiário:</label>
                            <input type="text" th:field="*{TelefoneEstagiario}" class="IForm input text">

                            <label class="IForm label">Insira o email do estagiário:</label>
                            <input type="email" th:field="*{EmailEstagiario}" class="IForm input text">

                            <label class="IForm label">Insira o curso e período do estagiário:</label>

                            <div class="DivOpcoes">

                                <select th:field="*{CursoEstagiario}" class="IForm input option">
                                    <option value="" disabled>Selecione uma opção</option>
                                    <option value="Comercio exterior">Comércio exterior</option>
                                    <option value="Análise e desenvolvimento de sistemas">Análise e desenvolvimento de sistemas</option>
                                    <option value="Desenvolvimento de software multiplataforma">Desenvolvimento de software multiplataforma</option>
                                    <option value="Recursos humanos">Recursos humanos</option>
                                    <option value="Polímeros">Polímeros</option>
                                </select>

                                <select th:field="*{PeriodoEstagiario}" class="IForm input option">
                                    <option value="" disabled>Selecione uma opção</option>
                                    <option value="Matutino">Matutino</option>
                                    <option value="Vespertino">Vespertino</option>
                                    <option value="Noturno">Noturno</option>
                                </select>

                            </div>

                            <div class="botoes">

                                <button type="button"
                                        class="FNavButton"
                                        id="btnProximo">
                                    Próximo
                                </button>

                            </div>

                        </section>


                        <!-- =========================
                             ETAPA 2
                        ========================== -->

                        <section class="etapa">

                            <h2>Dados da empresa</h2>

                            <label class="IForm label">Insira o nome da empresa:</label>
                            <input type="text" th:field="*{NomeEmpresa}" class="IForm input text">

                            <label class="IForm label">Insira a área de atuação da empresa:</label>
                            <input type="text" th:field="*{AreaEmpresa}" class="IForm input text">

                            <label class="IForm label">Insira o CNPJ da empresa:</label>
                            <input type="text" th:field="*{CnpjEmpresa}" class="IForm input text">

                            <label class="IForm label">Insira a cidade da empresa:</label>
                            <input type="text" th:field="*{CidadeEmpresa}" class="IForm input text">

                            <label class="IForm label">Insira o CEP da empresa:</label>
                            <input type="text" th:field="*{CepEmpresa}" class="IForm input text">

                            <label class="IForm label">Insira o email da empresa:</label>
                            <input type="email" th:field="*{EmailEmpresa}" class="IForm input text">

                            <label class="IForm label">Insira o site da empresa:</label>
                            <input type="url" th:field="*{SiteEmpresa}" class="IForm input text">

                            <label class="IForm label">Insira o telefone da empresa:</label>
                            <input type="text" th:field="*{TelefoneEmpresa}" class="IForm input text">

                            <label class="IForm label">Insira o linkedin da empresa:</label>
                            <input type="url" th:field="*{LinkedinEmpresa}" class="IForm input text">

                            <div class="botoes">

                                <button type="button"
                                        class="FNavButton"
                                        id="btnVoltar">
                                    Voltar
                                </button>

                                <button type="button"
                                        class="FNavButton"
                                        id="btnProximo2">
                                    Próximo
                                </button>

                            </div>

                        </section>


                        <!-- =========================
                             ETAPA 3
                        ========================== -->

                        <section class="etapa">

                            <h2>Dados do estágio</h2>

                            <label>Horário de entrada:</label>
                            <input type="time" th:field="*{HorarioEntrada}" class="IForm input text">

                            <label>Horário de saída:</label>
                            <input type="time" th:field="*{HorarioSaida}" class="IForm input text">

                            <label>Carga horária:</label>
                            <input type="text" th:field="*{CargaHoraria}" class="IForm input text">

                            <label class="IForm label">Insira o departamento que o estagiário irá trabalhar na empresa</label>

                            <input type="text" th:field="*{Departamento}" class="IForm input text">

                            <label class="IForm label">Selecione um supervisor ou insira um novo</label>

                            <div class="DivOpcoes">

                                <select th:field="*{Supervisor}"
                                        class="IForm input option supervisor">
                                    <option value="">Selecione uma opção</option>
                                </select>

                                <input type="text"
                                       th:field="*{NomeSupervisor}"
                                       class="IForm input text supervisor"
                                       placeholder="nome">

                                <input type="text"
                                       th:field="*{CargoSupervisor}"
                                       class="IForm input text supervisor"
                                       placeholder="cargo">

                            </div>

                            <div class="botoes">

                                <button type="button"
                                        class="FNavButton"
                                        id="btnVoltar2">
                                    Voltar
                                </button>

                                <button type="submit"
                                        class="IForm input finalizaForm">
                                    Finalizar
                                </button>

                            </div>

                        </section>

                    </div>

                </div>

            </form>

        </div>

    </div>


	<script>
	    const track = document.getElementById("carouselTrack");

	    const btnProximo = document.getElementById("btnProximo");
	    const btnVoltar = document.getElementById("btnVoltar");

	    const btnProximo2 = document.getElementById("btnProximo2");
	    const btnVoltar2 = document.getElementById("btnVoltar2");

	    const etapas = document.querySelectorAll(".etapa");
	    const carousel = document.querySelector(".carousel");
	    const form = document.querySelector(".formulario");
	    const container = document.querySelector(".IForm.container");

	    let etapaAtual = 0;

	    const totalEtapas = etapas.length;


	    /*
	     * Ajusta a altura do carousel para
	     * a altura EXATA da etapa atual.
	     */
	    function ajustarAlturaCarrossel(numero) {

	        const etapa = etapas[numero];

	        if (!etapa) {
	            return;
	        }

	        /*
	         * scrollHeight pega a altura real do conteúdo,
	         * mesmo quando a etapa está fora da área visível.
	         */
	        const altura = etapa.scrollHeight;

	        carousel.style.height = `${altura}px`;

	        form.style.height = `${altura}px`;

	        /*
	         * 50px = espaço vertical adicional
	         * do container.
	         */
	        container.style.height = `${altura + 50}px`;
	    }


	    /*
	     * Move o carousel para a etapa desejada.
	     */
	    function moverParaEtapa(numero) {

	        if (numero < 0 || numero >= totalEtapas) {
	            return;
	        }

	        etapaAtual = numero;

	        /*
	         * Como o track possui 300% de largura
	         * e cada etapa possui 33.333%, cada
	         * movimento corresponde a 33.333%.
	         */
	        const deslocamento =
	            numero * (100 / totalEtapas);

	        track.style.transform =
	            `translateX(-${deslocamento}%)`;

	        ajustarAlturaCarrossel(numero);
	    }


	    /*
	     * ETAPA 1 → ETAPA 2
	     */
	    btnProximo.addEventListener("click", function () {
	        moverParaEtapa(1);
	    });


	    /*
	     * ETAPA 2 → ETAPA 1
	     */
	    btnVoltar.addEventListener("click", function () {
	        moverParaEtapa(0);
	    });


	    /*
	     * ETAPA 2 → ETAPA 3
	     */
	    btnProximo2.addEventListener("click", function () {
	        moverParaEtapa(2);
	    });


	    /*
	     * ETAPA 3 → ETAPA 2
	     */
	    btnVoltar2.addEventListener("click", function () {
	        moverParaEtapa(1);
	    });


	    /*
	     * Calcula a altura inicial depois que
	     * todos os elementos foram carregados.
	     */
	    window.addEventListener("load", function () {

	        requestAnimationFrame(function () {
	            ajustarAlturaCarrossel(0);
	        });

	    });


	    /*
	     * Recalcula a altura quando a janela
	     * mudar de tamanho.
	     */
	    window.addEventListener("resize", function () {

	        requestAnimationFrame(function () {
	            ajustarAlturaCarrossel(etapaAtual);
	        });

	    });
	</script>


</body>

</html>
