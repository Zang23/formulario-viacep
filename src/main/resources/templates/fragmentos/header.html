<!-- templates/fragmentos/header.html -->
<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<body>

	<header th:fragment="header(activePage)">
		<div class="navTrigger"></div>
		<nav class="navbar">
			<div class="navLogo">
				<span class="logoMark"></span>
				<span>MinhaApp</span>
			</div>

			<div class="navLinks">
				<!-- Exemplo de como usar a variável activePage que você passou -->
				<a th:href="@{/}" th:classappend="${activePage == 'inicio'} ? 'active'">Início</a>
				<a th:href="@{/dashboard}" th:classappend="${activePage == 'listar'} ? 'active'">Listar</a>
				<a th:href="@{/formulario}" th:classappend="${activePage == 'formulario'} ? 'active'">Novo</a>
				<a th:href="@{/sobre}" th:classappend="${activePage == 'sobre'} ? 'active'">Sobre</a>
			</div>
		</nav>
	</header>

</body>

</html>
