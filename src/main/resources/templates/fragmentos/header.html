<!-- templates/fragmentos/header.html -->
<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<body>

	<header th:fragment="header(activePage)">
		<div class="navTrigger"></div>
		<nav class="navbar">
			<div class="navLogo">
				<span class="logoMark"></span>
				<span>Viacep</span>
			</div>
			<div class="navLinks">
				<a th:href="@{/}" th:classappend="${activePage == 'inicio'} ? 'active'">Início</a>
				<a th:href="@{/dashboard}" th:classappend="${activePage == 'listar'} ? 'active'">Listar</a>
				<div class="navDropdown">
					<button class="dropdownButton" th:classappend="${activePage == '/empresa/formulario' or activePage == '/contrato/formulario' or activePage == '/estagiario/formulario'} ? 'active'">Novo <span class="dropdownArrow">▾</span></button>
					<div class="dropdownMenu">
						<a th:href="@{/empresa/formulario}" th:classappend="${activePage == 'empresa/formulario'} ? 'active'">Nova Empresa</a>
						<a th:href="@{/contrato/formulario}" th:classappend="${activePage == 'contrato/formulario'} ? 'active'">Novo Contrato</a>
						<a th:href="@{/estagiario/formulario}" th:classappend="${activePage == 'estagiario/formulario'} ? 'active'">Novo Estagiário</a>
					</div>
				</div>
			</div>
		</nav>
	</header>

</body>

</html>
