
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: head('FormulárioEst')}"></head>

<body>

<header th:replace="~{fragmentos/header :: header('formularioest')}"></header>

<div class="divBackground">
    <div class="IForm container">
        <form th:action="@{/estagiario/formulario/salvar}"
              th:object="${dados}"
              method="post"
              class="formulario">

            <div class="carousel">
                <div class="carousel-track" id="carouselTrack">

                    <!-- ETAPA 1: DADOS DO ESTAGIÁRIO -->
                    <section class="etapa">
                        <h2>Dados do estagiário</h2>

                        <label class="IForm label">Insira o RA:</label>
                        <input type="number" th:field="*{ra}" class="IForm input text" required>

                        <label class="IForm label">Insira o nome:</label>
                        <input type="text" th:field="*{nome}" class="IForm input text" required>

                        <label class="IForm label">Insira a escolaridade:</label>
                        <input type="text" th:field="*{escolaridade}" class="IForm input text">

                        <label class="IForm label">Insira o telefone:</label>
                        <input type="text" th:field="*{telefone}" class="IForm input text">

                        <label class="IForm label">Insira o email:</label>
                        <input type="email" th:field="*{email}" class="IForm input text">

                        <label class="IForm label">Renda familiar mensal (R$):</label>
                        <input type="number"
                               th:field="*{rendaFamiliar}"
                               class="IForm input text"
                               min="0"
                               step="0.01"
                               required>

                        <label class="IForm label">Selecione o semestre, curso e período:</label>

                        <div class="DivOpcoes">
                            <select th:field="*{semestre}" class="IForm input option">
                                <option value="1">1º</option>
                                <option value="2">2º</option>
                                <option value="3">3º</option>
                                <option value="4">4º</option>
                                <option value="5">5º</option>
                                <option value="6">6º</option>
                            </select>

                            <select th:field="*{curso}" class="IForm input option">
                                <option value="">Selecione um curso</option>
                                <option value="Comercio exterior">Comércio exterior</option>
                                <option value="Análise e desenvolvimento de sistemas">Análise e desenvolvimento de sistemas</option>
                                <option value="Desenvolvimento de software multiplataforma">Desenvolvimento de software multiplataforma</option>
                                <option value="Recursos humanos">Recursos humanos</option>
                                <option value="Polímeros">Polímeros</option>
                            </select>

                            <select th:field="*{periodo}" class="IForm input option">
                                <option value="">Selecione um período</option>
                                <option value="Matutino">Matutino</option>
                                <option value="Vespertino">Vespertino</option>
                                <option value="Noturno">Noturno</option>
                            </select>
                        </div>

                        <label class="IForm label">Selecione o gênero:</label>
                        <select th:field="*{genero}" class="IForm input option">
                            <option value="">Selecione uma opção</option>
                            <option value="F">Feminino</option>
                            <option value="M">Masculino</option>
                            <option value="O">Outro</option>
                        </select>

                        <label class="IForm label">Selecione a etnia:</label>
                        <select th:field="*{etnia}" class="IForm input option">
                            <option value="">Selecione uma opção</option>
                            <option value="Asiatico">Asiático</option>
                            <option value="Branco">Branco</option>
                            <option value="Indigena">Indígena</option>
                            <option value="Pardo">Pardo</option>
                            <option value="Negro">Negro</option>
                            <option value="Outro">Outro</option>
                        </select>

                        <label class="IForm label">
                            Pessoa com deficiência (PCD):
                            <input type="checkbox"
                                   th:field="*{pcd}"
                                   class="IForm input checkbox">
                        </label>

                        <label class="IForm label">
                            Trabalha na área?
                            <input type="checkbox"
                                   th:field="*{trabalhaNaArea}"
                                   class="IForm input checkbox">
                        </label>

                        <div class="botoes">
                            <button type="button" class="IForm input proximo">
                                Próximo
                            </button>
                        </div>
                    </section>

                    <!-- ETAPA 2: ENDEREÇO -->
                    <section class="etapa">
                        <h2>Endereço</h2>

                        
						<label class="IForm label">Insira o CEP:</label>

						<div class="campoCep">
							<input
								type="text"
								th:field="*{cep}"
								class="IForm input text"
								id="cep"
								maxlength="9"
								placeholder="00000-000"
							>

							<button
								type="button"
								id="pesquisarCep"
								class="IForm input"
							>
								Pesquisar
							</button>
						</div>



                        <label class="IForm label">Insira o logradouro:</label>
                        <input type="text" th:field="*{logradouro}" class="IForm input text">

                        <label class="IForm label">Insira o número da rua:</label>
                        <input type="text" th:field="*{numPorta}" class="IForm input text">

                        <label class="IForm label">Insira o complemento:</label>
                        <input type="text" th:field="*{complemento}" class="IForm input text">

                        <label class="IForm label">Insira o bairro:</label>
                        <input type="text" th:field="*{bairro}" class="IForm input text">

                        <label class="IForm label">Insira a cidade:</label>
                        <input type="text" th:field="*{localidade}" class="IForm input text">

                        <label class="IForm label">Insira a UF:</label>
                        <input type="text"
                               th:field="*{uf}"
                               class="IForm input text"
                               maxlength="2">

                        <div class="botoes">
                            <button type="button" class="IForm input voltar">Voltar</button>
                            <button type="button" class="IForm input proximo">Próximo</button>
                        </div>
                    </section>

                    <!-- ETAPA 3: DADOS DA ESCOLA -->
                    <section class="etapa">
                        <h2>Dados da escola</h2>

                        <label class="IForm label">Insira o nome da escola:</label>
                        <input type="text" th:field="*{escolaNome}" class="IForm input text">

                        <label class="IForm label">
                            Insira a distância da escola em relação à FATEC (km):
                        </label>
                        <input type="number"
                               th:field="*{escolaDistancia}"
                               class="IForm input text"
                               min="0"
                               step="1">

                        <label class="IForm label">
                            O estagiário fez curso técnico?
                            <input type="checkbox"
                                   th:field="*{ensinoTecnico}"
                                   class="IForm input checkbox">
                        </label>

                        <div class="botoes">
                            <button type="button" class="IForm input voltar">Voltar</button>
                            <button type="submit" class="IForm input finalizaForm">
                                Finalizar
                            </button>
                        </div>
                    </section>

                </div>
            </div>
        </form>
    </div>
</div>

<script>
    const etapas = document.querySelectorAll(".etapa");
    let etapaAtual = 0;

    function mostrarEtapa() {
        etapas.forEach((etapa, index) => {
            etapa.style.display = index === etapaAtual ? "flex" : "none";
        });
    }

    document.querySelectorAll(".proximo").forEach(botao => {
        botao.addEventListener("click", () => {
            if (etapaAtual < etapas.length - 1) {
                etapaAtual++;
                mostrarEtapa();
            }
        });
    });

    document.querySelectorAll(".voltar").forEach(botao => {
        botao.addEventListener("click", () => {
            if (etapaAtual > 0) {
                etapaAtual--;
                mostrarEtapa();
            }
        });
    });

    mostrarEtapa();
</script>

</body>
</html>
