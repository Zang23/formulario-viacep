spring.application.name=formulario

# Banco de dados (MariaDB via docker compose). Podem ser sobrescritas por
# variaveis de ambiente, ex.: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mariadb://localhost:3306/formulario
spring.datasource.username=formulario
spring.datasource.password=formulario

# Schema e criado pelo docker/mariadb/init.sql; o Hibernate so confere se bate com as entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
